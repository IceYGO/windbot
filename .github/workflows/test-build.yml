name: Automated Test Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: windows-2022

    env:
      Solution_Name: WindBot.sln

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v3

    - name: Build!
      run: msbuild $env:Solution_Name /t:Build /p:Configuration=Release

    - name: Pack
      run: |
        mkdir dist
        xcopy /e /y bin\Release dist\WindBot\
        xcopy /y BotWrapper\bin\Release\bot.conf dist\
        xcopy /y BotWrapper\bin\Release\load-once.conf dist\
        xcopy /y BotWrapper\bin\Release\bot.exe dist\
        cd dist
        7z a WindBot.7z *
        cd ..

    - name: Upload build artifacts
      uses: actions/upload-artifact@v6
      with:
        path: dist\WindBot.7z

    - name: GitHub Release
      if: github.event_name == 'push'
      uses: marvinpinto/action-automatic-releases@latest
      with:
        repo_token: "${{ secrets.GITHUB_TOKEN }}"
        automatic_release_tag: "latest"
        prerelease: false
        title: "Development Build"
        files: |
          dist/WindBot.7z

  mono-build:
    runs-on: ubuntu-latest
    container:
      image: mono:6.8.0.123

    env:
      Solution_Name: WindBot.sln

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Build with Mono MSBuild
      run: msbuild "$Solution_Name" /t:Build /p:Configuration=Release /p:Platform="Any CPU"

    - name: Fix sqlite dll location
      # Old MSBuild don't process the TargetPath correctly. https://github.com/dotnet/msbuild/pull/6237
      # This is fixed in 16.10 that ships with latest mono.
      run: |
        for arch in x86 x64; do
          source_path="bin/Release/ThirdParty/sqlite/$arch/sqlite3.dll"
          target_dir="bin/Release/$arch"
          if [ -f "$source_path" ]; then
            mkdir -p "$target_dir"
            mv -f "$source_path" "$target_dir/sqlite3.dll"
            echo "Moved $source_path to $target_dir/sqlite3.dll"
          fi
        done

    - name: Upload Mono build artifacts
      uses: actions/upload-artifact@v6
      with:
        name: WindBot-mono
        path: bin/Release/
        if-no-files-found: error
